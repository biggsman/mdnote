<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>MdNote</title>
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <div class="sidebar-header">
          <span id="folder-name" class="folder-name" title="">폴더 없음</span>
          <button id="btn-refresh" class="icon-btn" title="새로 고침">⟳</button>
          <button id="btn-folder" class="icon-btn" title="폴더 열기 (Ctrl+Shift+O)">📂</button>
        </div>
        <div id="tree" class="tree">
          <div class="tree-empty">
            <p>열린 폴더가 없습니다.</p>
            <button class="text-btn" data-action="open-folder">폴더 열기 (Ctrl+Shift+O)</button>
          </div>
        </div>
      </aside>
      <main id="main">
        <div id="vditor"></div>
        <footer id="statusbar">
          <span id="status-path">새 문서</span>
          <span class="spacer"></span>
          <span id="status-dirty"></span>
          <span id="status-count"></span>
          <span id="status-mode" title="Ctrl+/ 로 전환">IR</span>
        </footer>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
