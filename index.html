<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>MdNote</title>
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <div class="sidebar-tabs">
          <button class="sidebar-tab active" data-panel="files">파일</button>
          <button class="sidebar-tab" data-panel="outline">개요</button>
        </div>
        <div id="panel-files" class="sidebar-panel">
        <div id="tree" class="tree">
          <div class="tree-empty">열린 폴더가 없음.</div>
        </div>
        <button id="folder-footer" class="folder-footer" title="다른 폴더 열기 (Ctrl+Shift+O)">폴더 열기...</button>
        </div>
        <div id="panel-outline" class="sidebar-panel" hidden>
          <div id="outline" class="outline"></div>
        </div>
      </aside>
      <div id="sidebar-resizer" title="끌어서 너비 조절 (더블클릭: 기본값)"></div>
      <main id="main">
        <div id="vditor"></div>
        <footer id="statusbar">
          <span id="status-path">새 문서</span>
          <span class="spacer"></span>
          <span id="status-dirty"></span>
          <span id="status-count"></span>
          <span id="status-mode" title="Ctrl+/ 로 전환">IR</span>
        </footer>
      </main>
    </div>
    <!-- 인쇄할 때만 보이는 영역 -->
    <div id="print-area"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
